name: build-windows
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Download pose models
        run: python scripts/fetch_models.py
      - name: Download FFmpeg
        run: python scripts/fetch_ffmpeg.py
      - name: Import check (window module needs Tk)
        run: python -c "import facemask.gui, facemask.cli; print('imports ok')"
      - name: Smoke test from source (ffmpeg + model + pipeline on Windows)
        run: python scripts/smoke_test.py
      - name: Build one-folder app
        run: pyinstaller --noconfirm facemask.spec
      - name: Smoke test the built app
        shell: pwsh
        run: |
          ./bin/ffmpeg.exe -v error -f lavfi -i testsrc=size=640x360:rate=30 -t 1 -pix_fmt yuv420p "冒烟 测试.mp4"
          ./dist/facemask/facemask-cli.exe "冒烟 测试.mp4" --output smoke_out --no-download
          if ($LASTEXITCODE -ne 0) { throw "built app failed" }
          Get-ChildItem smoke_out
          "size of dist/facemask: {0:N0} MB" -f ((Get-ChildItem dist/facemask -Recurse | Measure-Object Length -Sum).Sum / 1MB)
      - name: Add docs next to the exe
        shell: pwsh
        run: |
          Copy-Item docs/使用说明.txt dist/facemask/
          Copy-Item docs/测试清单.md dist/facemask/
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/facemask -DestinationPath facemask-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: facemask-windows-x64
          path: facemask-windows-x64.zip
          retention-days: 3
